name: Extract Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o TouringGo_V1_GitHubReady.zip -d extracted
          cp -R extracted/TouringGo_V1/. .
          rm -rf extracted
          rm -f TouringGo_V1_GitHubReady.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract TouringGo Android project" || echo "No changes"
          git push
